[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "movielens-recsys-pipeline"
version = "0.1.0"
description = "Foundation for a personalized MovieLens recommendation and analytics pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
recsys = "recsys.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
recsys = ["fixtures/*.csv"]
